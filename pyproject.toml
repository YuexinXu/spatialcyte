[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spatialcyte"
version = "0.1.0"
description = "Multiplexed IHC images -> spatial single-cell objects (AnnData), config-driven and panel-agnostic."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yuexin Xu" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
keywords = ["spatial", "single-cell", "mIHC", "multiplex", "anndata", "tumor-microenvironment"]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-image",
    "scikit-learn",
    "anndata",
    "tifffile",
    "pyyaml",
]

[project.urls]
Repository = "https://github.com/YuexinXu/spatialcyte"
Issues = "https://github.com/YuexinXu/spatialcyte/issues"

[project.optional-dependencies]
# Cellpose pulls in torch; kept optional so the core installs lightweight.
cellpose = ["cellpose>=4", "torch"]
dev = ["pytest", "ruff~=0.16.0", "pre-commit"]

[project.scripts]
spatialcyte = "spatialcyte.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
